<main class="flex-grow pt-20">
  <div
    class="min-h-[calc(100vh-5rem)] flex items-center justify-center relative overflow-hidden bg-[#0a0a0a]"
  >
    <div
      class="absolute inset-0 bg-[linear-gradient(rgba(38,38,38,0.5)_1px,transparent_1px),linear-gradient(90deg,rgba(38,38,38,0.5)_1px,transparent_1px)] bg-[size:60px_60px]"
    ></div>
    <div class="absolute inset-0 opacity-40">
      <div
        class="absolute top-1/4 left-1/4 w-96 h-96 bg-orange-500/20 rounded-full blur-[100px] animate-[float_6s_ease-in-out_infinite]"
      ></div>
      <div
        class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-yellow-500/10 rounded-full blur-[100px] animate-[float_8s_ease-in-out_infinite_1s]"
      ></div>
    </div>

    <div class="relative text-center px-4 max-w-lg mx-auto">
      <div class="relative mb-6">
        <h1
          class="text-[140px] md:text-[180px] font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-500 via-yellow-500 to-orange-500 leading-none select-none"
        >
          404
        </h1>
        <div
          class="absolute inset-0 text-[140px] md:text-[180px] font-black text-orange-500/20 blur-2xl leading-none select-none pointer-events-none"
          aria-hidden="true"
        >
          404
        </div>
      </div>

      <div class="relative w-28 h-28 mx-auto mb-8">
        <div
          class="absolute inset-0 bg-gradient-to-br from-orange-500/20 to-yellow-500/20 rounded-full border border-orange-500/30"
        ></div>
        <div class="absolute inset-0 flex items-center justify-center">
          <i class="fa-regular fa-face-frown text-[56px] text-orange-500"></i>
        </div>
        <div
          class="absolute -top-2 -right-2 w-5 h-5 bg-orange-500 rounded-lg rotate-12 animate-bounce"
        ></div>
        <div
          class="absolute -bottom-1 -left-3 w-4 h-4 bg-yellow-500 rounded-full animate-pulse"
        ></div>
      </div>

      <h2 class="text-2xl md:text-3xl font-bold text-white mb-4">عفواً! الصفحة غير موجودة</h2>
      <p class="text-neutral-400 mb-8 text-lg">
        الصفحة التي تبحث عنها غير موجودة أو تم نقلها. دعنا نعيدك إلى المسار الصحيح.
      </p>

      <div class="flex flex-col sm:flex-row justify-center gap-4 mb-12">
        <a
          class="cursor-pointer inline-flex items-center justify-center gap-2 h-[58px] px-8 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 text-white font-semibold shadow-lg shadow-orange-500/25 hover:shadow-orange-500/40 hover:-translate-y-0.5 transition-all duration-300"
          routerLink="/home"
        >
          <i class="fa-solid fa-house text-lg"></i>الذهاب للرئيسية
        </a>
        <a
          class="cursor-pointer inline-flex items-center justify-center gap-2 h-[58px] px-8 rounded-full border border-[#333333] text-white font-semibold hover:border-orange-500/50 hover:bg-orange-500/5 transition-all duration-300"
          routerLink="/blog"
        >
          <i class="fa-regular fa-newspaper text-lg"></i>تصفح المقالات
        </a>
      </div>

      <div class="pt-8 border-t border-[#262626]">
        <p class="text-sm text-neutral-500 mb-4">قد تجد هذه مفيدة:</p>
        <div class="flex flex-wrap justify-center gap-4 text-sm">
          <a
            class="cursor-pointer text-orange-500 hover:text-orange-400 hover:underline font-medium"
            routerLink="/blog"
            >المدونة</a
          >
          <span class="text-neutral-600">•</span>
          <a
            class="cursor-pointer text-orange-500 hover:text-orange-400 hover:underline font-medium"
            routerLink="/about"
            >من نحن</a
          >
          <span class="text-neutral-600">•</span>
          <a
            class="cursor-pointer text-orange-500 hover:text-orange-400 hover:underline font-medium"
            routerLink="/privacy"
            >الخصوصية</a
          >
        </div>
      </div>
    </div>
  </div>
</main>
